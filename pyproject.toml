[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "Multi-Agent AI Code Review System"
requires-python = ">=3.11"
dependencies = [
    # Core orchestration
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    # LLM providers
    "groq>=0.9.0",
    "google-generativeai>=0.7.0",
    # Retry / resilience
    "tenacity>=8.3.0",
    # Validation & config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Persistence
    "sqlmodel>=0.0.19",
    "sqlalchemy>=2.0.0",
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Observability
    "structlog>=24.2.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "prometheus-client>=0.20.0",
    # Static analysis tools
    "ruff>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
    "anyio>=4.4.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
argus = "argus.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
